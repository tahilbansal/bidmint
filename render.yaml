services:
  - type: web
    name: bidmint-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AISENSY_API_KEY
        sync: false
      - key: AISENSY_CAMPAIGN_TENDER
        value: tender_alert_v1
      - key: AISENSY_CAMPAIGN_PRICE
        value: price_digest_v1
      - key: ADMIN_WHATSAPP
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: MIN_MATCH_SCORE
        value: "70"
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: bidmint-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python scheduler.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AISENSY_API_KEY
        sync: false
      - key: AISENSY_CAMPAIGN_TENDER
        value: tender_alert_v1
      - key: AISENSY_CAMPAIGN_PRICE
        value: price_digest_v1
      - key: ADMIN_WHATSAPP
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: MIN_MATCH_SCORE
        value: "70"
      - key: ENVIRONMENT
        value: production
